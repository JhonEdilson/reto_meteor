<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donde Toño · Arquitectura de Lau</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; padding: 2rem; background: var(--color-paper); }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · Donde Toño · Meteor</p>
    <h1>Cómo atiende Lau un pedido</h1>

    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-lau-title arquitectura-lau-desc">
      <title id="arquitectura-lau-title">Cómo atiende Lau un pedido</title>
      <desc id="arquitectura-lau-desc">El cliente le escribe a Lau, que busca en el menú, cotiza con una función de cálculo determinista, registra el pedido en una colección oculta al modelo o pasa la conversación a una persona del equipo; un banco de pruebas aparte le escribe por API.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zona: Funciones IA (antes de flechas y nodos) -->
      <rect x="412" y="88" width="192" height="304" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="436" y="92" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FUNCIONES IA · FLUJOS</text>

      <!-- Flechas (detrás de los nodos) -->
      <!-- Cliente -> Lau -->
      <line x1="168" y1="248" x2="232" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lau -> Menú, Adiciones, Zonas (search_items nativo), por arriba de la zona -->
      <path d="M 304,216 V 64 Q 304,56 312,56 H 756 Q 764,56 764,64 V 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lau -> las 3 Funciones (puntos de salida separados en el borde derecho) -->
      <path d="M 376,232 H 384 Q 392,232 392,224 V 160 Q 392,152 400,152 H 428" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="376" y1="248" x2="428" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 376,264 H 384 Q 392,264 392,272 V 336 Q 392,344 400,344 H 428" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- cotizar -> datos (GET por API) -->
      <line x1="588" y1="152" x2="664" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- cotizar es requisito de crear (mismo turno) -->
      <line x1="508" y1="184" x2="508" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- crear -> Pedidos -->
      <line x1="588" y1="248" x2="664" y2="248" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- pasar -> persona -->
      <line x1="588" y1="344" x2="664" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Banco de pruebas -> Lau (POST /runs) -->
      <line x1="304" y1="432" x2="304" y2="280" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

      <!-- Etiquetas de flechas (con máscara y margen) -->
      <rect x="176" y="228" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="237" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCRIBE</text>
      <rect x="492" y="36" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="45" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSULTA EL MENÚ</text>
      <rect x="596" y="132" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="626" y="141" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEE POR ID</text>
      <rect x="516" y="194" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="203" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBLIGATORIA</text>
      <rect x="600" y="228" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTRA</text>
      <rect x="600" y="324" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="333" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSFIERE</text>
      <rect x="312" y="352" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="344" y="361" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /RUNS</text>

      <!-- Nodo: Cliente (entrada) -->
      <rect x="40" y="216" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="216" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="233" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="104" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cliente</text>
      <text x="104" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat de prueba</text>

      <!-- Nodo: Lau -->
      <rect x="232" y="216" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="216" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="254" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MET</text>
      <text x="304" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lau</text>
      <text x="304" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reglas · horario nativo</text>

      <!-- Nodo: Cotizar pedido (focal: el total no lo suma el modelo) -->
      <rect x="428" y="120" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="120" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="436" y="128" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="448" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="508" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cotizar pedido</text>
      <text x="508" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JS: total y tiempo</text>

      <!-- Nodo: Crear pedido -->
      <rect x="428" y="216" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="216" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="224" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="448" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="508" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Crear pedido</text>
      <text x="508" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">item.upsert</text>

      <!-- Nodo: Pasar a una persona -->
      <rect x="428" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="320" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="448" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="508" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pasar a una persona</text>
      <text x="508" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transfer_to_human</text>

      <!-- Nodo: Menú, Adiciones, Zonas -->
      <rect x="664" y="120" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="120" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="672" y="128" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="692" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATOS</text>
      <text x="764" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Menú · Adiciones · Zonas</text>
      <text x="764" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">precios, tiempos, disponible</text>

      <!-- Nodo: Pedidos (focal: el entregable de cocina) -->
      <rect x="664" y="216" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="216" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="672" y="224" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="692" y="233" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATOS</text>
      <text x="764" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pedidos</text>
      <text x="764" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">oculta al LLM · la ve cocina</text>

      <!-- Nodo: Persona del equipo (externo) -->
      <rect x="664" y="312" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="312" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="672" y="320" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="686" y="329" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="764" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persona del equipo</text>
      <text x="764" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bandeja · Piden humano</text>

      <!-- Nodo: Banco de pruebas (opcional, aparte de producción) -->
      <rect x="204" y="432" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="204" y="432" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="212" y="440" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="232" y="449" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEST</text>
      <text x="304" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Banco de pruebas</text>
      <text x="304" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Evals · Pedidos de prueba</text>

      <!-- Leyenda -->
      <line x1="40" y1="520" x2="960" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
      <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Clave del diseño</text>
      <rect x="164" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Met o Función</text>
      <rect x="276" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="296" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Colección</text>
      <rect x="368" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="388" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fuera de producción</text>
      <line x1="500" y1="558" x2="528" y2="558" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escritura del pedido</text>
      <line x1="652" y1="558" x2="680" y2="558" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="688" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada a la API de Meteor</text>
      <line x1="836" y1="558" x2="864" y2="558" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="872" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Requisito o prueba</text>
    </svg>
  </div>
</body>
</html>
